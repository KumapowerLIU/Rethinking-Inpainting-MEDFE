# Fresh full-data experiment after the fixed-four-image L1 diagnostic.
# G updates 1-5000 use three L1 losses only. Original PatchGAN starts on
# update 5001; its G loss weight reaches 0.002 on update 15000.
# D uses its normal RaLSGAN objective once enabled; only the G weight ramps.
model:
  base_channels: 64
  residual_blocks: 4
  pconv_layers: 5
  gaussian_sigma: 1.5
  init_gain: 0.02
  activation_checkpointing: true
data:
  format: indexed_rtv
  rtv_cache: data/indexed-rtv-cache
  train_manifest: data/train.jsonl
  val_manifest: data/validation.jsonl
  image_size: 256
  batch_size: 128
  workers: 8
  mask_mode: random
  min_fraction: 0.1
  max_fraction: 0.4
loss:
  reconstruction: 1.0
  structure: 1.0
  texture: 1.0
  lpips: 0.0
  perceptual: 0.0
  style: 0.0
  adversarial: 0.002
discriminator:
  global_kind: patch
  global_width: 64
  local_width: 64
  local_crop_size: 64
  chunk_size: 8
  pretrained_path: ''
train:
  output: runs/medfe-l1-gan-ramp-large-batch
  amp: bf16
  seed: 2019
  epochs: 60
  schedule: constant
  lr: 0.0002
  beta1: 0.5
  beta2: 0.999
  adversarial_warmup_steps: 5000
  adversarial_ramp_steps: 10000
  save_every: 100
  evaluate_every: 100
  log_every: 10
  evaluation_images: 32
  evaluation_batch_size: 4
  memory_budget_gib: 38
  allow_weight_download: false
