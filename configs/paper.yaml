# Joint MEDFE with corrected operators and the paper's loss coefficients.
# See docs/paper-alignment.md for ambiguities and departures from released code.
model:
  base_channels: 64
  residual_blocks: 4
  pconv_layers: 5
  gaussian_sigma: 1.5
data:
  train_manifest: data/train.jsonl
  val_manifest: data/validation.jsonl
  image_size: 256
  batch_size: 4
  workers: 4
  mask_mode: random
  min_fraction: 0.1
  max_fraction: 0.4
loss:
  reconstruction: 1.0
  lpips: 0.0
  perceptual: 0.1
  style: 250.0
  structure: 1.0
  texture: 1.0
  adversarial: 0.2
discriminator:
  global_kind: patch
  local_crop_size: 64
train:
  output: runs/medfe-paper
  amp: bf16
  epochs: 60
  schedule: constant
  lr: 0.0002
  save_every: 100
  evaluate_every: 500
