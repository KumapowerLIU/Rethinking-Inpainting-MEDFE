# Released loss/GAN intent with corrected operators and explicit encoder features.
# Keep the existing 60-epoch budget and online random masks. The released VGG
# profile uses raw [-1,1] inputs and its original layer choices, with the old
# relu5_2 routing bug fixed. This is not a bitwise replay of legacy bugs.
model:
  base_channels: 64
  residual_blocks: 4
  pconv_layers: 5
  gaussian_sigma: 1.5
  init_gain: 0.02
  activation_checkpointing: true
data:
  train_manifest: data/train.jsonl
  val_manifest: data/validation.jsonl
  image_size: 256
  batch_size: 128
  workers: 8
  mask_mode: random
  min_fraction: 0.1
  max_fraction: 0.4
loss:
  reconstruction: 1.0
  lpips: 0.0
  perceptual: 0.2
  style: 250.0
  structure: 1.0
  texture: 1.0
  adversarial: 0.2
  vgg_profile: released
  vgg_chunk_size: 4
discriminator:
  global_kind: patch
  global_width: 64
  local_width: 64
  local_crop_size: 64
  chunk_size: 8
  pretrained_path: ''
train:
  output: runs/medfe-released-large-batch
  amp: bf16
  epochs: 60
  schedule: constant
  lr: 0.0002
  beta1: 0.5
  beta2: 0.999
  adversarial_warmup_steps: 0
  adversarial_ramp_steps: 0
  save_every: 100
  evaluate_every: 100
  evaluation_images: 32
  evaluation_batch_size: 4
  memory_budget_gib: 38
  allow_weight_download: false
