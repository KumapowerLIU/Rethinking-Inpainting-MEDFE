# Use byte-identical CSA train/validation manifests; retain intentional face repeats.
model:
  backbone: sd_partial
  blocks_per_scale: 2
  base_channels: 64
  residual_blocks: 4
  pconv_layers: 5
  gaussian_sigma: 1.5
  init_gain: 0.02
  activation_checkpointing: true
data:
  format: indexed_rtv
  rtv_cache: data/indexed-rtv-cache
  train_manifest: data/train.jsonl
  val_manifest: data/validation.jsonl
  image_size: 256
  batch_size: 128
  workers: 8
  mask_mode: random
  min_fraction: 0.1
  max_fraction: 0.4
  allow_repeated_records: true
loss:
  reconstruction: 1.0
  structure: 1.0
  texture: 1.0
  lpips: 1.0
  perceptual: 0.0
  style: 0.0
  adversarial: 0.002
  lpips_net: vgg
  lpips_chunk_size: 8
discriminator:
  global_kind: patch
  global_width: 64
  local_width: 64
  local_crop_size: 64
  chunk_size: 8
  pretrained_path: ''
train:
  output: runs/medfe-sd-partial-csa-mix-large-batch
  amp: bf16
  seed: 2019
  epochs: 60
  schedule: constant
  lr: 0.0002
  beta1: 0.5
  beta2: 0.999
  adversarial_warmup_steps: 5000
  adversarial_ramp_steps: 10000
  save_every: 100
  evaluate_every: 100
  log_every: 10
  evaluation_images: 32
  evaluation_batch_size: 4
  memory_budget_gib: 38
  allow_weight_download: false
